<script>


    function gattx(){
        var quantita = window.prompt("inserire quanti numeri positivi si vuole inserire: ");
        var i = 0;
        var min = 9999999;
        var max = -9999999;

         if (quantita.toLowerCase() === "gaster"){
            document.getElementById("g").src = "https://upload.wikimedia.org/wikipedia/en/2/29/Wdgaster.png?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original";
            return;
        }

        if (quantita.toLowerCase() === "riddle"){
            document.getElementById("g").src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSz7tGJ-7YauwqEAFXrI0wCyTbdvIS5pSzVCoFZ-T39UA&s=10";
            return;
        }

         if (quantita.toLowerCase() === "onceler"){
            document.getElementById("g").src = "https://i.pinimg.com/1200x/a7/c8/72/a7c87214a758f9740910fb69f73128d4.jpg";
            return;
         }

        if (isNaN(quantita) || quantita <= 0){
            alert("inserire un numero maggiore di 0");
            location.reload();
            return;
        }

       

        while (i<quantita){
            var num = parseInt(window.prompt("inserisci un numero: "));
            i = i + 1;
            if(isNaN(num) || num < 0){
                  alert("inserire un numero maggiore di 0")
                  location.reload();
                  return;
            }
            else{
            if (num <= min){
                  min = num;
            }

            if (num >= max){
                  max = num;
            }
      }


        }

        document.getElementById("numero").innerHTML = "il numero piu piccolo è " + min + " e il numero piu grande è " + max


    }


        


</script>

      <h2> NUMERO PIU PICCOLO </h2>

      <button onclick ="gattx()"> cliccami </button>

      <p id="numero"></p>
